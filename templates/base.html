<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}IUSCase{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">
    <a class="marca" href="{{ url_for('inicio') }}">⚖️ IUSCase</a>
    <div class="enlaces">
        {% if session.usuario_id %}
        <a href="{{ url_for('dashboard.panel') }}">Mi panel</a>
        <a href="{{ url_for('auth.logout') }}">Cerrar sesión</a>
        {% else %}
        <a href="{{ url_for('auth.login') }}">Ingresar</a>
        <a href="{{ url_for('auth.registro') }}">Registrarse</a>
        {% endif %}
    </div>
</nav>

<div class="contenedor">

    {% with mensajes = get_flashed_messages() %}
        {% if mensajes %}
        <ul class="mensajes">
            {% for m in mensajes %}
            <li>{{ m }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    {% endwith %}

    {% block contenido %}{% endblock %}

</div>

</body>

</html>
