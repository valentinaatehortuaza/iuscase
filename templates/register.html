{% extends "base.html" %}
{% block titulo %}Registrarse - IUSCase{% endblock %}
{% block contenido %}

<div class="tarjeta-auth">
    <div class="auth-marca">⚖️</div>
    <h1 class="auth-titulo">Crea tu cuenta</h1>
    <p class="auth-subtitulo">Empieza a estudiar sentencias reales con ayuda de IA</p>

    <form method="POST" class="formulario">
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" required>
        </div>
        <div class="campo">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" required minlength="6">
        </div>
        <button type="submit" class="boton-ancho">Registrarme</button>
    </form>

    <p class="auth-enlace"><a class="enlace" href="{{ url_for('auth.login') }}">¿Ya tienes cuenta? Ingresa</a></p>
</div>

{% endblock %}
