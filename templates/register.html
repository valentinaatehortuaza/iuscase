{% extends "base.html" %}
{% block titulo %}Registrarse - IUSCase{% endblock %}
{% block contenido %}

<div class="tarjeta-auth">
    <div class="auth-marca">⚖️</div>
    <h1 class="auth-titulo">Crea tu cuenta</h1>
    <p class="auth-subtitulo">Empieza a estudiar sentencias reales con ayuda de IA</p>

    <form method="POST" class="formulario">
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" autocomplete="username" required>
        </div>
        <div class="campo">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" required minlength="6">
        </div>
        <div class="campo-check">
            <input type="checkbox" id="acepta_politica" name="acepta_politica" value="si" required>
            <label for="acepta_politica">
                He leído y acepto la
                <a class="enlace" href="{{ url_for('politica_datos') }}" target="_blank" rel="noopener">Política de tratamiento de datos personales</a>,
                y autorizo de forma previa, expresa e informada el tratamiento de mis datos para las finalidades allí descritas,
                incluida su transmisión a los proveedores de alojamiento e inteligencia artificial ubicados fuera de Colombia.
            </label>
        </div>
        <button type="submit" class="boton-ancho">Registrarme</button>
    </form>

    <p class="auth-enlace"><a class="enlace" href="{{ url_for('auth.login') }}">¿Ya tienes cuenta? Ingresa</a></p>
</div>

{% endblock %}
